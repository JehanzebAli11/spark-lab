[project]
name = "spark-lab"
version = "0.1.0"
description = "Job queue, nightly runner and reports for an always-on DGX Spark"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jehanzeb Ali" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Rendering the screen-injection dataset and the browser tests; then: python -m playwright install chromium
security = ["playwright>=1.48"]

[project.scripts]
lab = "lab.cli:main"

[tool.setuptools.packages.find]
include = ["lab*", "guard*"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "BLE"]
ignore = ["DTZ005"]   # naive now() is fine where we immediately call .astimezone()

[tool.ruff.lint.per-file-ignores]
# HTML page fragments read better unbroken
"guard/screen_injection/templates.py" = ["E501"]
"guard/screen_injection/generate.py" = ["E501"]
"guard/media/*.py" = ["E501"]
