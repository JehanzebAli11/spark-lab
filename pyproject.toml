[project]
name = "spark-lab"
version = "0.1.0"
description = "Job queue, nightly runner and reports for an always-on DGX Spark"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jehanzeb Ali" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Offline training and evaluation only (labml/). The queue itself stays standard library.
ml = ["numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8", "pillow>=10", "torch>=2.2"]

[project.scripts]
lab = "lab.cli:main"

[tool.setuptools]
packages = ["lab", "labml", "labml.doctor"]

[tool.setuptools.package-data]
lab = ["models/*.json"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DTZ", "BLE"]
ignore = ["DTZ005", "B905"]   # naive now() then .astimezone(); zip() lengths are equal by construction
