name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: bash -n jobs/nightly.sh scripts/setup_spark.sh publish/publish.sh
      - run: pytest -q
      - run: python -m labml.readme --check   # README results block must match results/*.json
