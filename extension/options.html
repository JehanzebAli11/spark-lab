<!doctype html>
<html><head><meta charset="utf-8"><title>Spark Guard settings</title>
<style>body{font:14px system-ui,sans-serif;max-width:520px;margin:24px} label{display:block;margin:12px 0 4px}
input[type=text]{width:100%} .note{color:#555}</style></head>
<body>
<h1>Spark Guard</h1>
<label for="endpoint">Model endpoint (must be on this machine)</label>
<input id="endpoint" type="text">
<label><input id="screenshots" type="checkbox"> Send screenshots to the local model</label>
<label for="threshold">Act when the model is at least this sure (0 to 1)</label>
<input id="threshold" type="number" min="0" max="1" step="0.05">
<p><button id="save">Save</button> <span id="status"></span></p>
<p class="note">Nothing is sent anywhere except the endpoint above, which must be localhost. Password and form values are never read.</p>
<script src="options.js"></script>
</body></html>
